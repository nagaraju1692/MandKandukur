name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.11
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release credentials
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in repository Actions secrets."
            exit 1
          fi

      - name: Build Android APK with EAS
        id: eas
        shell: bash
        run: |
          npm ci
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > eas-build.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(data)?data[0]:data; const url=build?.artifacts?.buildUrl; if(!url) throw new Error('EAS did not return an APK URL'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url='+url+'\n');"

      - name: Download APK
        shell: bash
        run: curl --fail --location --retry 3 "${{ steps.eas.outputs.url }}" --output ManaKandukur-${{ github.ref_name }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          git fetch --tags --force
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" "ManaKandukur-${{ github.ref_name }}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes